<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Clients | CounselEase</title><link rel="stylesheet" href="styles.css"></head>
<body class="app-body" data-page="clients"><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="dashboard.html"><span class="brand-mark small"></span><span>CounselEase<small>CARE MANAGEMENT</small></span></a>
<nav><a href="dashboard.html" data-nav="dashboard">▦ <span>Dashboard</span></a><a href="clients.html" data-nav="clients">♙ <span>Clients</span></a><a href="appointments.html" data-nav="appointments">▣ <span>Appointments</span></a><a href="records.html" data-nav="records">▤ <span>Session records</span></a><a href="counsellor-feedback.html" data-nav="counsellor-feedback">☆ <span>Feedback</span></a></nav>
<div class="sidebar-bottom"><div class="user-mini"><div class="avatar">CE</div><div><b id="sideUser">Counsellor</b><small>System user</small></div></div><button type="button" id="logoutBtn" class="logout">↪ Log out</button></div></aside><main class="main-area"><header class="topbar"><div><p class="eyebrow">COUNSELLING MANAGEMENT</p><h1>Client management</h1></div><div class="top-user"><span class="avatar">CE</span><span id="topUser">Counsellor</span></div></header><section class="content">
<div class="toolbar"><div><h2>Client directory</h2><p class="muted">Create, view, update and delete client information.</p></div><button type="button" class="btn primary" id="addClientBtn">＋ Add client</button></div>
<div class="panel"><div class="table-tools"><input id="clientSearch" class="search-input" type="search" placeholder="Search by name, email or phone..."></div><div id="clientsTable" class="table-wrap"></div></div>
<div id="clientModal" class="modal hidden"><div class="modal-card"><div class="panel-heading"><div><h3 id="clientModalTitle">Add client</h3><p class="muted">Enter the client's basic information.</p></div><button type="button" class="icon-btn" id="closeClientModal">✕</button></div><form id="clientForm" class="form-grid"><input type="hidden" id="clientId"><label>Full name<input id="clientName" required></label><label>Email<input id="clientEmail" type="email" required></label><label>Phone number<input id="clientPhone" type="tel" autocomplete="tel" required></label><label>Age<input id="clientAge" type="number" min="1" max="120" step="1" inputmode="numeric" required></label><label class="span-two">Notes<textarea id="clientNotes" rows="3" placeholder="Optional general notes"></textarea></label><p id="clientError" class="error span-two"></p><div class="form-actions span-two"><button type="button" class="btn secondary" id="cancelClient">Cancel</button><button class="btn primary" type="submit">Save client</button></div></form></div></div>
</section></main></div><script src="app.js"></script></body></html>
