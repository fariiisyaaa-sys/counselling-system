<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My profile | CounselEase</title><link rel="stylesheet" href="styles.css"></head>
<body class="app-body" data-page="profile"><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="client-dashboard.html"><span class="brand-mark small"></span><span>CounselEase<small>CARE MANAGEMENT</small></span></a><nav></nav><div class="sidebar-bottom"><div class="user-mini"><div class="avatar">CE</div><div><b id="sideUser">Client</b><small>Client account</small></div></div><button type="button" id="logoutBtn" class="logout">↪ Log out</button></div></aside><main class="main-area"><header class="topbar"><div><p class="eyebrow">COUNSELLING MANAGEMENT</p><h1>My profile</h1></div><div class="top-user"><span class="avatar">CE</span><span id="topUser">Client</span></div></header><section class="content">
<div class="toolbar"><div><h2>Personal information</h2><p class="muted">Manage your own profile details.</p></div></div>
<div class="panel"><form id="profileForm" class="form-grid"><label>Full name<input id="profileName" required minlength="2"></label><label>Email address<input id="profileEmail" type="email" readonly></label><label>Phone number<input id="profilePhone" type="tel" autocomplete="tel"></label><label>Age<input id="profileAge" type="number" min="1" max="120" step="1" inputmode="numeric"></label><p id="profileError" class="error span-two" aria-live="polite"></p><div class="form-actions span-two"><button class="btn primary" type="submit">Save profile</button></div></form></div>
</section></main></div><script src="app.js"></script></body></html>
