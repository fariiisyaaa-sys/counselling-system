<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My appointments | CounselEase</title><link rel="stylesheet" href="styles.css"></head>
<body class="app-body" data-page="my-appointments"><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="client-dashboard.html"><span class="brand-mark small"></span><span>CounselEase<small>CARE MANAGEMENT</small></span></a><nav></nav><div class="sidebar-bottom"><div class="user-mini"><div class="avatar">CE</div><div><b id="sideUser">Client</b><small>Client account</small></div></div><button type="button" id="logoutBtn" class="logout">↪ Log out</button></div></aside><main class="main-area"><header class="topbar"><div><p class="eyebrow">COUNSELLING MANAGEMENT</p><h1>My appointments</h1></div><div class="top-user"><span class="avatar">CE</span><span id="topUser">Client</span></div></header><section class="content">
<div class="toolbar"><div><h2>Appointment history</h2><p class="muted">Only your own appointments are shown here.</p></div><button type="button" class="btn primary" id="bookAppointmentBtn">＋ Book an appointment</button></div>
<div class="panel"><div id="clientAppointmentsTable" class="table-wrap"></div></div>
<div id="clientAppointmentModal" class="modal hidden"><div class="modal-card"><div class="panel-heading"><div><h3>Request an appointment</h3><p class="muted">Choose a date and time. Your request will be marked pending.</p></div><button type="button" class="icon-btn" id="closeClientAppointmentModal">✕</button></div><form id="clientAppointmentForm" class="form-grid"><label class="span-two">Counsellor<select id="clientAppointmentCounsellor" required></select></label><label>Date<input id="clientAppointmentDate" type="date" required></label><label>Time<input id="clientAppointmentTime" type="time" required></label><p id="clientAppointmentError" class="error span-two"></p><div class="form-actions span-two"><button type="button" class="btn secondary" id="cancelClientAppointment">Cancel</button><button class="btn primary" type="submit">Request appointment</button></div></form></div></div>
</section></main></div><script src="app.js"></script></body></html>
